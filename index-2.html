<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}body{margin:0}</style>
<title>飲みルーレット</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: one-screen izakaya table — wheel centered, lantern-glow result card below, single deliberate dark look */
:root{
  --bg:#1b1630;
  --bg2:#261f42;
  --ink:#fbf3e4;
  --muted:#b9adcf;
  --lantern:#ffb23e;
  --line:#3a3160;
  --s1:#e8473f; --s2:#ff9a2e; --s3:#f5d04a; --s4:#3fbf8f; --s5:#3d8fe0; --s6:#a560d8; --s7:#ff6fa8; --s8:#6fd3e6; --gold:#ffd23f;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%) fixed, var(--bg);
  color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 28px;
  display:flex;justify-content:center;
}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;gap:18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,8vw,40px);margin:0;letter-spacing:.04em;text-wrap:balance;
  color:var(--lantern);text-shadow:0 0 18px rgba(255,178,62,.45)}
.sub{margin:-10px 0 0;color:var(--muted);font-size:13px}
.wheel-box{position:relative;width:100%;max-width:400px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block;max-width:100%}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;
  border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.5));z-index:2}
.hub{position:absolute;inset:0;margin:auto;width:24%;height:24%;border-radius:50%;
  background:var(--bg);border:4px solid var(--ink);display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(14px,4.5vw,20px);color:var(--lantern);cursor:pointer;
  box-shadow:0 0 0 6px rgba(0,0,0,.25)}
.hub:focus-visible{outline:3px solid var(--lantern);outline-offset:4px}
.result{width:100%;min-height:92px;border-radius:18px;background:rgba(0,0,0,.28);border:2px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px;text-align:center}
.result .label{font-size:12px;letter-spacing:.12em;color:var(--muted)}
.result .value{font-family:var(--display);font-size:clamp(26px,8vw,36px);line-height:1.2}
.result.hit{border-color:var(--hit,var(--lantern));box-shadow:0 0 24px -4px var(--hit,var(--lantern))}
.result.hit .value{color:var(--hit);animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
.spin{font-family:var(--display);font-size:22px;letter-spacing:.1em;color:var(--bg);background:var(--lantern);
  border:none;border-radius:999px;padding:14px 48px;cursor:pointer;box-shadow:0 6px 0 #b36d10}
.spin:active{transform:translateY(4px);box-shadow:0 2px 0 #b36d10}
.spin:disabled{opacity:.55;cursor:default}
.spin:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.log{width:100%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:26px}
.chip{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;color:#1b1630}
.count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.game,.draw{width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
.draw-head{width:100%;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.draw-head b{color:var(--lantern);font-family:var(--display);font-weight:400;letter-spacing:.08em}
.card{width:100%;min-height:260px;border-radius:22px;border:3px dashed var(--lantern);cursor:pointer;
  background:repeating-linear-gradient(135deg,rgba(255,178,62,.07) 0 14px,transparent 14px 28px),rgba(0,0,0,.3);
  color:var(--ink);font-family:var(--body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
.card.open{border-style:solid;background:rgba(0,0,0,.45);box-shadow:0 0 30px -6px var(--lantern)}
.card:disabled{cursor:default;opacity:.7}
.card:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.card-label{font-weight:800;font-size:18px}
.card-num{font-family:var(--display);font-size:clamp(110px,34vw,160px);line-height:1;color:var(--lantern);text-shadow:0 0 24px rgba(255,178,62,.5);animation:pop .4s ease-out}
.card-hint{font-size:13px;color:var(--muted)}
.note{margin:0;font-size:13px;color:var(--muted);text-align:center;line-height:1.7}
.redraw{font-family:var(--body);font-weight:800;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 16px;cursor:pointer}
.redraw:focus-visible{outline:2px solid var(--lantern);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.card-num{animation:none}}
@media (prefers-reduced-motion:reduce){.result.hit .value{animation:none}}
</style>

</head>
<body>
<div class="wrap">
  <h1>飲みルーレット</h1>
  <p class="sub">回して出たマスの人が飲む。</p>

  <section class="draw" id="drawSec">
    <div class="draw-head"><b>番号くじ</b><span id="left">残り 6 枚</span></div>
    <button class="card" id="card" type="button">
      <span class="card-label" id="cardLabel">タップして自分の番号を見る</span>
      <span class="card-num" id="cardNum" hidden></span>
      <span class="card-hint" id="cardHint">他の人に見られないように</span>
    </button>
    <button class="spin" id="startBtn" type="button">ゲーム開始</button>
    <p class="note">1人ずつタップして番号を覚える → もう一度タップで隠す → 次の人へ。<br>全員引いたら「ゲーム開始」。</p>
  </section>

  <div class="game" id="game" hidden>

  <div class="wheel-box">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="800" height="800" aria-label="ルーレット"></canvas>
    <div class="hub" id="hub" role="button" tabindex="0" aria-label="回す">回す</div>
  </div>

  <div class="result" id="result" aria-live="polite">
    <span class="label">けっか</span>
    <span class="value" id="value">？？？</span>
  </div>

  <button class="spin" id="spin" type="button">回す！</button>

  <div class="count" id="count">0 回目</div>
  <div class="log" id="log"></div>
  <button class="redraw" id="redraw" type="button">番号を引き直す</button>
  </div>
</div>

<script>
const css = getComputedStyle(document.documentElement);
const items = [
  {t:"飲む",       c:css.getPropertyValue('--s1').trim()},
  {t:"右隣が飲む",  c:css.getPropertyValue('--s2').trim()},
  {t:"左隣が飲む",  c:css.getPropertyValue('--s3').trim()},
  {t:"両隣が飲む",  c:css.getPropertyValue('--s4').trim()},
  {t:"向かいが飲む", c:css.getPropertyValue('--s5').trim()},
  {t:"全員で飲む",  c:css.getPropertyValue('--s6').trim()},
  {t:"〇〇が飲む", pick:true, c:css.getPropertyValue('--s8').trim()},
  {t:"王様", r:"👑 王様！番号で指名して飲ませる", crown:true, c:css.getPropertyValue('--s7').trim()},
];
const GOLD = css.getPropertyValue('--gold').trim();
function crown(x, s){
  ctx.save(); ctx.translate(x,0); ctx.rotate(Math.PI/2);
  ctx.beginPath();
  ctx.moveTo(-s, s*.55); ctx.lineTo(-s,-s*.5); ctx.lineTo(-s*.5,0); ctx.lineTo(0,-s*.85);
  ctx.lineTo(s*.5,0); ctx.lineTo(s,-s*.5); ctx.lineTo(s,s*.55); ctx.closePath();
  ctx.fillStyle=GOLD; ctx.fill(); ctx.lineWidth=5; ctx.lineJoin='round'; ctx.strokeStyle='#1b1630'; ctx.stroke();
  [[-s,-s*.5],[0,-s*.85],[s,-s*.5]].forEach(([px,py])=>{ctx.beginPath();ctx.arc(px,py,s*.16,0,Math.PI*2);ctx.fill();ctx.stroke();});
  ctx.beginPath(); ctx.arc(0,s*.15,s*.14,0,Math.PI*2); ctx.fillStyle='#e8473f'; ctx.fill();
  ctx.restore();
}
const cv = document.getElementById('wheel'), ctx = cv.getContext('2d');
const N = items.length, seg = Math.PI*2/N, R = 390, C = 400;
let angle = 0, spinning = false, turns = 0;

function draw(){
  ctx.clearRect(0,0,800,800);
  ctx.save(); ctx.translate(C,C); ctx.rotate(angle);
  // outer ring
  ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fillStyle='#fbf3e4'; ctx.fill();
  for(let i=0;i<N;i++){
    const a0 = -Math.PI/2 + i*seg - seg/2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R-14,a0,a0+seg); ctx.closePath();
    ctx.fillStyle = items[i].c; ctx.fill();
    ctx.lineWidth = 4; ctx.strokeStyle = '#1b1630'; ctx.stroke();
    // label
    ctx.save(); ctx.rotate(a0+seg/2);
    ctx.textAlign='right'; ctx.textBaseline='middle';
    ctx.fillStyle='#1b1630';
    const txt = items[i].t;
    // fit text between hub edge and outer ring so long labels never overlap the hub
    const outer = items[i].crown ? R-150 : R-40, inner = 116;
    let fs = 54; ctx.font = `400 ${fs}px "Dela Gothic One", sans-serif`;
    const w = ctx.measureText(txt).width;
    if(w > outer-inner) fs = Math.floor(fs*(outer-inner)/w);
    ctx.font = `400 ${fs}px "Dela Gothic One", sans-serif`;
    if(items[i].crown){ crown(R-90, 38); ctx.fillStyle='#1b1630'; }
    ctx.fillText(txt, outer, 0);
    ctx.restore();
  }
  // studs
  for(let i=0;i<N*3;i++){
    const a = i*(Math.PI*2/(N*3));
    ctx.beginPath(); ctx.arc(Math.cos(a)*(R-7), Math.sin(a)*(R-7), 5, 0, Math.PI*2);
    ctx.fillStyle = '#ffb23e'; ctx.fill();
  }
  ctx.restore();
}

let actx;
function tick(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 1400; o.type='square';
    g.gain.setValueAtTime(.06, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+.04);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+.05);
  }catch(e){}
}

function stab(t, len, vol){
  // brass-like chord: sawtooths through a lowpass, plus a low boom
  const notes = [130.81, 196.0, 261.63, 329.63, 392.0];
  const f = actx.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(600, t); f.frequency.linearRampToValueAtTime(3200, t+.06);
  f.frequency.exponentialRampToValueAtTime(900, t+len);
  const g = actx.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.02);
  g.gain.setValueAtTime(vol, t+len*.6); g.gain.exponentialRampToValueAtTime(.0001, t+len);
  f.connect(g).connect(actx.destination);
  notes.forEach((hz,k)=>{ [-6,6].forEach(det=>{
    const o = actx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz; o.detune.value=det;
    o.connect(f); o.start(t); o.stop(t+len+.05);
  }); });
  const b = actx.createOscillator(), bg = actx.createGain();
  b.type='sine'; b.frequency.setValueAtTime(110,t); b.frequency.exponentialRampToValueAtTime(40,t+.35);
  bg.gain.setValueAtTime(.5,t); bg.gain.exponentialRampToValueAtTime(.0001,t+.45);
  b.connect(bg).connect(actx.destination); b.start(t); b.stop(t+.5);
}
function babaan(){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + .02;
    stab(t, .16, .09);        // バ
    stab(t+.2, 1.4, .11);     // バーン
  }catch(e){}
}

function indexAt(a){
  // pointer at top (-PI/2). segment i centered at -PI/2 + i*seg after rotation.
  const norm = ((-a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  return Math.round(norm/seg) % N;
}

function spin(){
  if(spinning) return;
  spinning = true; spinBtn.disabled = true;
  const res = document.getElementById('result');
  res.classList.remove('hit'); document.getElementById('value').textContent = '…';
  const target = Math.floor(Math.random()*N);
  const jitter = (Math.random()-.5)*seg*.7;
  const start = angle;
  const base = -target*seg + jitter;
  const cur = ((start % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let delta = ((base - cur) % (Math.PI*2) + Math.PI*2) % (Math.PI*2);
  delta += Math.PI*2*(5+Math.floor(Math.random()*3));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur = reduce ? 600 : 4200 + Math.random()*800;
  const t0 = performance.now();
  let lastIdx = indexAt(start);
  function frame(now){
    const p = Math.min(1,(now-t0)/dur);
    const e = 1 - Math.pow(1-p, 4);
    angle = start + delta*e;
    draw();
    const idx = indexAt(angle + seg/2);
    if(idx!==lastIdx){ lastIdx = idx; tick(); }
    if(p<1) requestAnimationFrame(frame); else done(indexAt(angle));
  }
  requestAnimationFrame(frame);
}

function done(i){
  spinning = false; spinBtn.disabled = false; turns++;
  babaan();
  const it = items[i];
  const res = document.getElementById('result');
  res.style.setProperty('--hit', it.c);
  let label = it.r || it.t, chipText = it.crown ? '👑 王様' : it.t;
  if(it.pick){
    const src = drawn.length ? drawn : [1,2,3,4,5,6];
    const n = src[Math.floor(Math.random()*src.length)];
    label = `${n}番が飲む！`; chipText = `${n}番が飲む`;
  }
  document.getElementById('value').textContent = label;
  res.classList.add('hit');
  document.getElementById('count').textContent = turns + ' 回目';
  const chip = document.createElement('span');
  chip.className='chip'; chip.style.background = it.c; chip.textContent = chipText;
  const log = document.getElementById('log');
  log.prepend(chip);
  while(log.children.length>12) log.lastChild.remove();
}

const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', spin);
const hub = document.getElementById('hub');
hub.addEventListener('click', spin);
hub.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();spin();} });

// ---- 番号くじ ----
const drawSec = document.getElementById('drawSec'), game = document.getElementById('game');
const card = document.getElementById('card'), cardLabel = document.getElementById('cardLabel');
const cardNum = document.getElementById('cardNum'), cardHint = document.getElementById('cardHint');
const leftEl = document.getElementById('left');
let pool = [], drawn = [], drawState = 'ready';

function resetPool(){
  pool = [1,2,3,4,5,6]; drawn = [];
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  drawState = 'ready'; renderCard();
}
function renderCard(){
  leftEl.textContent = `残り ${pool.length} 枚`;
  card.classList.toggle('open', drawState==='shown');
  card.disabled = drawState==='empty';
  cardNum.hidden = drawState!=='shown';
  if(drawState==='ready'){ cardLabel.textContent='タップして自分の番号を見る'; cardHint.textContent='他の人に見られないように'; }
  if(drawState==='shown'){ cardLabel.textContent='あなたの番号'; cardHint.textContent='覚えたらタップして隠す'; }
  if(drawState==='empty'){ cardLabel.textContent='全部引き終わりました'; cardHint.textContent='「ゲーム開始」を押してね'; }
}
card.addEventListener('click', ()=>{
  if(drawState==='ready' && pool.length){ const n = pool.pop(); drawn.push(n); cardNum.textContent = n; drawState='shown'; }
  else if(drawState==='shown'){ cardNum.textContent=''; drawState = pool.length ? 'ready' : 'empty'; }
  renderCard();
});
document.getElementById('startBtn').addEventListener('click', ()=>{
  cardNum.textContent=''; drawSec.hidden = true; game.hidden = false; draw();
});
document.getElementById('redraw').addEventListener('click', ()=>{
  if(spinning) return;
  game.hidden = true; drawSec.hidden = false; resetPool();
  turns = 0; document.getElementById('count').textContent='0 回目';
  document.getElementById('log').innerHTML='';
  const res=document.getElementById('result'); res.classList.remove('hit');
  document.getElementById('value').textContent='？？？';
});
resetPool();

draw();
if(document.fonts) document.fonts.ready.then(draw);
</script>

</body>
</html>
